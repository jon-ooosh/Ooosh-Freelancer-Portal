# Ooosh Operations Portal - Nginx Configuration
# Usage: Copy to /etc/nginx/sites-available/ooosh-portal
#        Then: ln -s /etc/nginx/sites-available/ooosh-portal /etc/nginx/sites-enabled/
#        Replace YOUR_SERVER_IP with your Hetzner IP address
#        When ready for a domain, replace the server_name and add SSL with certbot

server {
    listen 80;
    server_name YOUR_SERVER_IP;  # Replace with your Hetzner IP or domain later

    # Frontend - serve static build
    root /var/www/ooosh-portal/frontend/dist;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Content-Security-Policy — REPORT-ONLY first (Oct 2026, SECURITY-AUDIT-BRIEF B.1).
    # Nothing is blocked while the header is the Report-Only one; the browser posts
    # what WOULD have been blocked to /api/csp-report, which logs it. Watch
    # `journalctl -u ooosh-portal | grep csp-report` for a week, add anything
    # legitimate to the policy, then rename the header to Content-Security-Policy.
    #
    # What each source is for:
    #   script-src 'self'            Vite bundle; no inline scripts, no CDNs
    #   style-src  'unsafe-inline'   React style={{…}} attributes and Leaflet
    #   img-src    openstreetmap     Leaflet tiles (fleet map, GPS trace); *.r2.dev = public vehicle photos
    #   connect-src wss:             Socket.io over the same host
    #   frame/object-src blob:       receipt + licence PDFs shown inline (<iframe>/<embed> on blob: URLs)
    #   cdnjs / Google Fonts         ONLY the two static tools (public/stage-view.html, staging-calculator.html)
    #
    # KNOWN BLOCKER before enforcing: public/stage-view.html has one inline <script>.
    # Move it into a file (or add its sha256 to script-src) first, or that page breaks.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://*.r2.dev; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' wss://staff.oooshtours.co.uk https://*.r2.dev; frame-src 'self' blob:; object-src 'self' blob:; worker-src 'self' blob:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; report-uri /api/csp-report" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;

    # API proxy - pass to Express backend
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Allow larger request bodies (file uploads, allocation payloads)
        client_max_body_size 10m;

        # Increase timeouts for long-running API calls
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # WebSocket proxy for Socket.IO
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend SPA - all other routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets (exclude /api/ paths so they proxy correctly)
    location ~* ^(?!/api/)\S+\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
