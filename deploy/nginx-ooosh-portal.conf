# Ooosh Operations Portal - Nginx Configuration
# Usage: Copy to /etc/nginx/sites-available/ooosh-portal
#        Then: ln -s /etc/nginx/sites-available/ooosh-portal /etc/nginx/sites-enabled/
#        Replace YOUR_SERVER_IP with your Hetzner IP address
#        When ready for a domain, replace the server_name and add SSL with certbot

server {
    listen 80;
    server_name YOUR_SERVER_IP;  # Replace with your Hetzner IP or domain later

    # Frontend - serve static build
    root /var/www/ooosh-portal/frontend/dist;
    index index.html;

    # Security headers — LIVE on the server since 12 Oct 2026 (added by hand to
    # /etc/nginx/sites-available/default, staff.oooshtours.co.uk 443 block).
    # Before that the live config had none of them; only this reference copy did.
    add_header X-Content-Type-Options "nosniff" always;
    # SAMEORIGIN, not DENY: the app frames its own staging calculator (/staging-calculator.html).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Staff host only — not every oooshtours.co.uk subdomain is known to be HTTPS.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Permissions-Policy "camera=(), microphone=()" always;

    # Content-Security-Policy — ENFORCED since 19 Oct 2026 (SECURITY-AUDIT-BRIEF B.1)
    # after a week report-only (12–19 Oct). The browser still posts anything it
    # blocks to /api/csp-report: `journalctl -u ooosh-portal | grep csp-report`.
    # The week found exactly two things:
    #   'wasm-unsafe-eval'   heic2any (iPhone HEIC → JPEG in lib/imageNormalise.ts) compiles
    #                        WebAssembly; without this, iPhone photo uploads silently fail.
    #                        It permits wasm compilation ONLY — not JavaScript eval. Allowed below.
    #   www.jotform.com      three studio-sitter lock-up reference photos migrated from
    #                        Jotform. Allowed until 27 Oct 2026, when they were re-uploaded to
    #                        R2 (Settings › Studio sitter) and the source was dropped. Jotform
    #                        had begun redirecting them to files.jotform.com, which this
    #                        policy never allowed, so the allowance had stopped working anyway.
    #
    # What each source is for:
    #   script-src 'self'            Vite bundle; no inline scripts, no CDNs
    #   style-src  'unsafe-inline'   React style={{…}} attributes and Leaflet
    #   img-src    openstreetmap     Leaflet tiles (fleet map, GPS trace); *.r2.dev = public vehicle photos
    #   connect-src wss:             Socket.io over the same host
    #   frame/object-src blob:       receipt + licence PDFs shown inline (<iframe>/<embed> on blob: URLs)
    #   cdnjs / Google Fonts         ONLY the two static tools (public/stage-view.html, staging-calculator.html)
    #   frame-ancestors 'self'       the staging calculator is framed by the app; 'none' would block it
    #
    # public/stage-view.html's viewer script lives in public/stage-view.js (moved Oct 2026)
    # precisely so script-src 'self' needs no inline exception.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://*.r2.dev; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' wss://staff.oooshtours.co.uk https://*.r2.dev; frame-src 'self' blob:; object-src 'self' blob:; worker-src 'self' blob:; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; report-uri /api/csp-report" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;

    # Hire close-out: raising an invoice (an EU VAT split especially) can take over a
    # minute of HireHop + Xero round trips. At 60s nginx gave up and the page said
    # "Request failed" while the server carried on and finished (job 15745, Oct 2026).
    # The panel also re-reads the plan when the reply is lost, so this is belt and braces.
    location /api/close-out/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
        proxy_connect_timeout 60s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    # API proxy - pass to Express backend
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Allow larger request bodies (file uploads, allocation payloads)
        client_max_body_size 10m;

        # Increase timeouts for long-running API calls
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # WebSocket proxy for Socket.IO
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend SPA - all other routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets (exclude /api/ paths so they proxy correctly)
    location ~* ^(?!/api/)\S+\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
