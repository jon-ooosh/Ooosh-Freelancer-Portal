# Dependabot configuration
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Security updates (auto-PRs for known vulnerabilities) are enabled separately
# via repo Settings -> Advanced Security -> "Dependabot security updates" and
# do NOT require this file. This file adds *scheduled* version updates so deps
# don't quietly rot between security advisories.
#
# Low-noise design:
#   - Weekly, Monday mornings (aligns with the server health-check email).
#   - Routine minor/patch bumps are GROUPED into one PR per project.
#   - Major (potentially breaking) bumps come as individual PRs to review.
#   - Open-PR limits keep the queue small.
version: 2
updates:
  # --- Next.js freelancer / payment portal (repo root) ---
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # Skipped on purpose (Nov 2026) - lift each when its reason goes away.
    ignore:
      # TypeScript 7 broke the Netlify build (PR 1625). Revisit once Next supports it.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
      # ESLint 10 broke the Netlify build: Next 15 lints during `next build` (PR 1626).
      # Next 16 stops doing that - revisit after it is merged.
      - dependency-name: "eslint"
        versions: [">=9.0.0"]
      # Types must match the Node that runs the code: Netlify NODE_VERSION 22 (PR 1628
      # offered 26). Raise this with the Node major (docs/MAINTENANCE.md, Node 22 -> April 2027).
      - dependency-name: "@types/node"
        versions: [">=23.0.0"]

  # --- OP backend (Express API) ---
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Types must match the server's Node 22 - raise with the Node major (see the root entry).
      - dependency-name: "@types/node"
        versions: [">=23.0.0"]

  # --- OP frontend (React + Vite SPA) ---
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # --- GitHub Actions used by workflows (e.g. deploy.yml) ---
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
