# Dependabot configuration
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Security updates (auto-PRs for known vulnerabilities) are enabled separately
# via repo Settings -> Advanced Security -> "Dependabot security updates" and
# do NOT require this file. This file adds *scheduled* version updates so deps
# don't quietly rot between security advisories.
#
# Low-noise design:
#   - Weekly, Monday mornings (aligns with the server health-check email).
#   - Routine minor/patch bumps are GROUPED into one PR per project.
#   - Major (potentially breaking) bumps come as individual PRs to review.
#   - Open-PR limits keep the queue small.
version: 2
updates:
  # --- Next.js freelancer / payment portal (repo root) ---
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # Skipped on purpose (Nov 2026) - lift each when its reason goes away.
    ignore:
      # TypeScript 7 broke the Netlify build (PR 1625). Revisit once Next supports it.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
      # Tailwind 4 broke the Netlify build (PR 1653): it moves the config (tailwind.config.js,
      # the portal's design tokens) into CSS - a planned migration, not a Dependabot merge.
      - dependency-name: "tailwindcss"
        versions: [">=4.0.0"]
      # Types must match the Node that runs the code: Netlify NODE_VERSION 22 (PR 1628
      # offered 26). Raise this with the Node major (docs/MAINTENANCE.md, Node 22 -> April 2027).
      - dependency-name: "@types/node"
        versions: [">=23.0.0"]

  # --- OP backend (Express API) ---
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Types must match the server's Node 22 - raise with the Node major (see the root entry).
      - dependency-name: "@types/node"
        versions: [">=23.0.0"]
      # Express 5 broke the backend build (PR 1656): it changes route path syntax and
      # error handling across every route - a planned migration, not a Dependabot merge.
      - dependency-name: "express"
        versions: [">=5.0.0"]

  # --- OP frontend (React + Vite SPA) ---
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # Skipped on purpose (Nov 2026) - planned migrations, not Dependabot merges.
    ignore:
      # React 19 broke the frontend build (PRs 1650, 1652 - Dependabot also split react and
      # react-dom, which only work as a pair). Lift all four together.
      - dependency-name: "react"
        versions: [">=19.0.0"]
      - dependency-name: "react-dom"
        versions: [">=19.0.0"]
      - dependency-name: "@types/react"
        versions: [">=19.0.0"]
      - dependency-name: "@types/react-dom"
        versions: [">=19.0.0"]
      # Tailwind 4 moves the config into CSS (see the root entry, PR 1653).
      - dependency-name: "tailwindcss"
        versions: [">=4.0.0"]

  # --- GitHub Actions used by workflows (e.g. deploy.yml) ---
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
